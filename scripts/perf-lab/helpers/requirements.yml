name: Requirements needed to run benchmarks
scripts:
  ensure-requirements:
    - script: ensure-graalvm
    - script: ensure-java
    - script: ensure-git
    - script: ensure-gcc
    - script: ensure-jbang
    - script: ensure-node
    - script: ensure-jvm-opts

  # Needed only by the Node.js runtimes. Note that install-package-linux uses dnf, so on
  # Debian/Ubuntu hosts Node.js must already be installed - the `which node` check below then
  # passes and nothing is installed.
  ensure-node-linux:
    - script: check-and-install-package
      with:
        command: node
        package: nodejs npm

  ensure-node-macos:
    - script: check-and-install-package
      with:
        command: node
        package: node

  ensure-node:
    - script: ensure-node-${{os}}

  ensure-jvm-opts:
    - read-state: config.profiler.name
      then:
        - regex: ^(jfr|flamegraph)$
          then:
            - set-state: PROFILER_JVM_ARGS -XX:+UnlockDiagnosticVMOptions -XX:+DebugNonSafepoints

  ensure-gcc-linux:
    - script: check-and-install-package
      with:
        command: gcc
        package: gcc.x86_64 zlib-devel.x86_64

  ensure-gcc-macos:
    - script: check-and-install-package
      with:
        command: gcc
        package: gcc

  ensure-gcc:
    - script: ensure-gcc-${{os}}

  ensure-git-linux:
    - script: check-and-install-package
      with:
        command: git
        package: git-all

  ensure-git-macos:
    - script: check-and-install-package
      with:
        command: git
        package: git

  ensure-git:
    - script: ensure-git-${{os}}