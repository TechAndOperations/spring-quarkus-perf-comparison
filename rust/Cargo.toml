[package]
name = "rust"
version = "1.0.0"
edition = "2021"
publish = false

# Release profile tuned for a benchmark binary rather than iteration speed: full LTO and a single
# codegen unit both raise build time (measured by the pipeline) in exchange for runtime speed.
# panic = "abort" drops unwinding tables, shrinking the binary and RSS slightly; acceptable here
# since this process is never embedded as a library and a panic should just kill the instance.
[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }

# Runtime-checked queries only (sqlx::query / query_as, never the query!/query_as! macros), so
# `cargo build` never needs a live database connection - consistent with
# `buildRequiresTestServices: false` for this runtime.
# "macros" only enables #[derive(sqlx::FromRow)] here - the compile-time-checked query!/query_as!
# bang-macros (which would need a live DB at `cargo build` time) are never used in this codebase.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros"] }

# The ORM path (QUERY_MODE=orm, the default). Wraps the same sqlx PgPool created for the SQL path
# (see lib.rs::connect) via SqlxPostgresConnector, so DB_POOL_MAX applies identically to both
# modes rather than each opening its own pool.
#
# "with-rust_decimal" is required for `entities::store_fruit_price::Model::price`: the column is
# `numeric(12,2)`, and sqlx's `Decode<Postgres> for f64` only accepts the FLOAT8 OID, not NUMERIC
# (OID 1700) - selecting a numeric column straight into an `f64` field fails at runtime with a
# type-mismatch error (500s from the orm query path). The raw-SQL path avoids this by casting
# `price::float8` in the query text (see repository_sql.rs); SeaORM has no per-query cast for
# entity-derived queries, so the entity field is `Decimal` instead, converted to `f64` in
# repository_orm.rs when building the DTO - the same numeric-to-f64 narrowing, just done in Rust
# rather than in SQL.
sea-orm = { version = "1", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-rust_decimal"] }
# Only for its `ToPrimitive::to_f64()` on the `Decimal` type above, converting the ORM path's
# `store_fruit_price::Model::price` to the same `f64` DTO shape the raw-SQL path already casts to.
rust_decimal = "1"

# Needed to make FruitRepository a dyn-compatible trait: native async fn in traits is not yet
# object-safe for dyn dispatch, so trait methods are boxed the same way sea-orm's own internals do.
async-trait = "0.1"
# Unifies sqlx::Error and sea_orm::DbErr behind one Result type in the FruitRepository trait,
# rather than a hand-rolled error enum - the standard idiom for application (not library) code.
anyhow = "1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Observability parity with quarkus3-virtual (quarkus-micrometer-opentelemetry: traces at
# traceidratio 0.1, OTLP export, JVM runtime metrics). These crates must stay on matching major
# versions - if `cargo build` fails here on first use, bump them all together rather than one at
# a time. See src/tracing_setup.rs and rust/README.md.
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "logs"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "logs"] }
tracing-opentelemetry = "0.33"
# Bridges `tracing` events to OTel log records, the analogue of the Go module's otelslog bridge.
opentelemetry-appender-tracing = "0.32"
# Tokio runtime metrics (worker count, queue depth, busy time) - the analogue of the JVM
# runtime metrics Micrometer publishes automatically for the Quarkus modules. Needs opentelemetry
# 0.32+, which is why this was unavailable at the 0.27 pin above.
opentelemetry-instrumentation-tokio = "0.2"
# HTTP middleware spans (route, method, status, duration) around every request, the same depth
# Quarkus/Spring/NestJS/Go already get from their own frameworks - the current #[instrument] on
# service.rs only covers the application layer, not the HTTP boundary. Also needs 0.32+.
#
# "tracing_level_info": without it, the span this crate creates is emitted at TRACE, not INFO -
# tracing_setup.rs's EnvFilter::new("info") on the OTel layer then drops it silently, and only the
# inner #[instrument] span makes it to Tempo. Confirmed missing by inspecting a real trace before
# adding this.
axum-tracing-opentelemetry = { version = "0.38", features = ["tracing_level_info"] }

[dev-dependencies]
# default-features off + rustls-tls: avoids linking against system OpenSSL (native-tls), which
# this host does not have development headers for.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
