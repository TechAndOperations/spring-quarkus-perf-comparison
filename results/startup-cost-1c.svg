  }</style><rect width="900" height="560" fill="var(--surface-1)"/><text x="74" y="30" fill="var(--text-primary)" font-size="17" font-weight="600">Startup cost: delay and memory before the first response</text><text x="74" y="50" fill="var(--text-secondary)" font-size="12.5">One point per runtime, median-TTFR run · 1 core · bottom-left is cheapest</text><text x="74" y="67" fill="var(--text-secondary)" font-size="11.5">Both axes logarithmic: TTFR varies by a factor of 312 between Rust and Spring on the JVM, RSS by a factor of 54</text><line x1="74" y1="384.0" x2="732" y2="384.0" stroke="var(--grid)" stroke-width="1"/><text x="64" y="388.0" fill="var(--text-secondary)" font-size="11.5" text-anchor="end">50</text><line x1="74" y1="297.0" x2="732" y2="297.0" stroke="var(--grid)" stroke-width="1"/><text x="64" y="301.0" fill="var(--text-secondary)" font-size="11.5" text-anchor="end">100</text><line x1="74" y1="210.0" x2="732" y2="210.0" stroke="var(--grid)" stroke-width="1"/><text x="64" y="214.0" fill="var(--text-secondary)" font-size="11.5" text-anchor="end">200</text><line x1="119.8" y1="122" x2="119.8" y2="494" stroke="var(--grid)" stroke-width="1"/><text x="119.8" y="516" fill="var(--text-secondary)" font-size="11.5" text-anchor="middle">50</text><line x1="189.5" y1="122" x2="189.5" y2="494" stroke="var(--grid)" stroke-width="1"/><text x="189.5" y="516" fill="var(--text-secondary)" font-size="11.5" text-anchor="middle">100</text><line x1="259.2" y1="122" x2="259.2" y2="494" stroke="var(--grid)" stroke-width="1"/><text x="259.2" y="516" fill="var(--text-secondary)" font-size="11.5" text-anchor="middle">200</text><line x1="351.3" y1="122" x2="351.3" y2="494" stroke="var(--grid)" stroke-width="1"/><text x="351.3" y="516" fill="var(--text-secondary)" font-size="11.5" text-anchor="middle">500</text><line x1="421.0" y1="122" x2="421.0" y2="494" stroke="var(--grid)" stroke-width="1"/><text x="421.0" y="516" fill="var(--text-secondary)" font-size="11.5" text-anchor="middle"